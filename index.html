<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background: #101216; color: #e8eaf0; }
    #app { display: flex; height: 100%; }
    #sidebar {
      width: 240px; padding: 20px 16px; background: #171a20;
      border-right: 1px solid #262a33; display: flex; flex-direction: column; gap: 8px;
    }
    #sidebar h1 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    #sidebar .sub { font-size: 12px; color: #8a90a0; margin-bottom: 12px; }
    .model-btn {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2f3a;
      background: transparent; color: #cdd2de; font-size: 13px; text-align: left;
      cursor: pointer; transition: background .15s, border-color .15s;
    }
    .model-btn:hover { background: #1f232c; }
    .model-btn.active { background: #2450a0; border-color: #3a6fd8; color: #fff; }
    #info { margin-top: auto; font-size: 11px; color: #8a90a0; line-height: 1.5; }
    #viewport { flex: 1; position: relative; }
    canvas { display: block; }
    #loader {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #8a90a0; pointer-events: none; opacity: 0; transition: opacity .2s;
    }
    #loader.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <h1>3D Model Viewer</h1>
      <div class="sub">three.js + glTF</div>
      <div id="model-list"></div>
      <div id="info">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
    </nav>
    <main id="viewport">
      <div id="loader">Loading model&hellip;</div>
    </main>
  </div>
  <script type="importmap">
    { "imports": { "three": "./libs/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
